<ng-container *ngIf="!isLoginRoute">

    <!-- ══ Welcome bubble ══ -->
    <div *ngIf="showWelcome" class="bot-welcome-bubble">
        <span>{{ welcomeText }}</span>
    </div>

    <!-- ══ THE BOT CHARACTER (always visible, closed state) ══ -->
    <div class="bot-scene" #botEl [class.bot-jumping]="isJumping" [class.bot-dragging]="isDragging"
        [ngStyle]="botDragStyle" (click)="toggleChat()" (mousedown)="onBotPointerDown($event)"
        (touchstart)="onBotPointerDown($event)" (contextmenu)="$event.preventDefault()" *ngIf="!isOpen || isJumping">

        <!-- Wave arm (appears on logout hover OR welcome) -->
        <div class="bot-arm-wrap" [class.waving]="isWaving">
            <div class="bot-arm"></div>
            <div class="bot-hand">👋</div>
        </div>

        <!-- PERSPECTIVE WRAPPER (never transform-style on same element as perspective) -->
        <div class="bot-3d-perspective">

            <!-- 3D body (rotates as a whole toward cursor + scroll) -->
            <div class="bot-body-3d" [style.transform]="botBodyTransform">

                <!-- HEAD -->
                <div class="bot-head">
                    <!-- Antenna -->
                    <div class="bot-antenna-stem"></div>
                    <div class="bot-antenna-ball"></div>

                    <!-- Face -->
                    <div class="bot-face">
                        <div class="bot-eye-pair">
                            <div class="bot-eye">
                                <div class="bot-pupil" [style.transform]="pupilTransform"></div>
                                <div class="bot-pupil-shine"></div>
                            </div>
                            <div class="bot-eye">
                                <div class="bot-pupil" [style.transform]="pupilTransform"></div>
                                <div class="bot-pupil-shine"></div>
                            </div>
                        </div>
                        <div class="bot-mouth happy"></div>
                    </div>
                </div>

                <!-- Torso -->
                <div class="bot-torso">
                    <div class="bot-torso-screen">
                        <div class="bot-led" style="background:#10b981;"></div>
                        <span class="bot-oss-text">OSS</span>
                        <div class="bot-led" style="background:#f59e0b;"></div>
                    </div>
                </div>

                <!-- Feet -->
                <div class="bot-feet">
                    <div class="bot-foot"></div>
                    <div class="bot-foot"></div>
                </div>

            </div><!-- /bot-body-3d -->
        </div><!-- /bot-3d-perspective -->

        <!-- Tooltip (left side) -->
        <div class="bot-tooltip">Assistant IA</div>
        <!-- Shadow -->
        <div class="bot-shadow"></div>
    </div><!-- /bot-scene -->


    <!-- ══ CHAT WINDOW ══ -->
    <div class="chat-window" *ngIf="isOpen && !isJumping">

        <!-- Header -->
        <div class="chat-header">
            <div class="chat-header-bot">
                <div class="chat-header-avatar">
                    <span class="material-symbols-outlined">smart_toy</span>
                    <span class="chat-avatar-dot"></span>
                </div>
                <div>
                    <p class="chat-title">{{ translate.t.chatTitle }}</p>
                    <p class="chat-subtitle">Intelligence Artificielle · OSS</p>
                </div>
            </div>
            <button class="chat-close" (click)="toggleChat()">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <!-- Accent bar -->
        <div class="chat-accent-bar"></div>

        <!-- Messages -->
        <div class="chat-messages" #chatWindow>
            <div *ngFor="let msg of messages" class="chat-msg-row" [class.chat-msg-user]="msg.sender === 'user'"
                [class.chat-msg-ai]="msg.sender === 'ai'">

                <div *ngIf="msg.sender === 'ai'" class="chat-ai-avatar">
                    <span class="material-symbols-outlined" style="font-size:14px;">smart_toy</span>
                </div>

                <div class="chat-bubble" [class.chat-bubble-user]="msg.sender === 'user'"
                    [class.chat-bubble-ai]="msg.sender === 'ai'" [innerHTML]="formatMessage(msg.text)">
                </div>
            </div>

            <!-- Typing indicator -->
            <div class="chat-msg-row chat-msg-ai" *ngIf="isWaiting">
                <div class="chat-ai-avatar">
                    <span class="material-symbols-outlined" style="font-size:14px;">smart_toy</span>
                </div>
                <div class="chat-bubble chat-bubble-ai chat-typing">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="chat-input-area">
            <form (submit)="sendMessage()" class="chat-form">
                <input type="text" name="message" [(ngModel)]="inputText" [placeholder]="translate.t.chatPlaceholder"
                    class="chat-input" autocomplete="off" [disabled]="isWaiting" />
                <button type="submit" class="chat-send-btn" [disabled]="!inputText.trim() || isWaiting">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </form>
            <p class="chat-disclaimer">L'IA peut générer des informations imprécises.</p>
        </div>

    </div><!-- /chat-window -->

</ng-container>
