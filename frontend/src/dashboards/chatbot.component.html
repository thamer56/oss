<!-- Floating Chat Button — Professional placement right side -->
<button *ngIf="!isOpen && !isLoginRoute" (click)="toggleChat()" class="fixed z-50 transition-all duration-300 group
           bottom-20 right-4 md:bottom-12 md:right-6
           flex items-center gap-2
           bg-gradient-to-br from-blue-600 to-indigo-700
           text-white rounded-2xl shadow-2xl shadow-blue-600/30
           px-4 py-3 md:px-5 md:py-3.5
           hover:shadow-blue-500/50 hover:scale-105 active:scale-95">
    <span class="material-symbols-outlined text-xl">smart_toy</span>
    <span class="hidden md:inline text-sm font-bold tracking-wide">Assistant IA</span>
</button>

<!-- Chat Window -->
<div *ngIf="isOpen && !isLoginRoute"
    class="fixed bottom-4 right-4 md:bottom-6 md:right-6 w-[calc(100vw-2rem)] md:w-96 h-[80vh] md:h-[500px] max-h-[800px] bg-white rounded-2xl shadow-2xl flex flex-col z-50 border border-slate-200 overflow-hidden transform transition-all">

    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-4 flex items-center justify-between text-white shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm">
                <span class="material-symbols-outlined text-white">smart_toy</span>
            </div>
            <div>
                <h3 class="font-bold text-sm">{{ translate.t.chatTitle }}</h3>
                <p class="text-[10px] text-blue-100 uppercase tracking-wider font-semibold">Intelligence Artificielle
                </p>
            </div>
        </div>
        <button (click)="toggleChat()" class="p-1 hover:bg-white/20 rounded-lg transition-colors">
            <span class="material-symbols-outlined text-white">close</span>
        </button>
    </div>

    <!-- Messages Area -->
    <div #chatWindow class="flex-1 overflow-y-auto p-4 bg-slate-50 space-y-4">
        <div *ngFor="let msg of messages" class="flex flex-col max-w-[85%]"
            [ngClass]="{'self-end items-end ml-auto': msg.sender === 'user', 'self-start items-start': msg.sender === 'ai'}">
            <div class="px-4 py-2.5 rounded-2xl text-sm shadow-sm"
                [ngClass]="msg.sender === 'user' ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-white text-slate-800 border border-slate-200 rounded-bl-sm'"
                [innerHTML]="formatMessage(msg.text)">
            </div>
            <span class="text-[10px] text-slate-400 mt-1 font-medium px-1">{{ msg.sender === 'user' ? 'Vous' : 'OSS Bot'
                }}</span>
        </div>

        <!-- Loading Indicator -->
        <div *ngIf="isWaiting" class="flex flex-col max-w-[85%] self-start items-start">
            <div
                class="px-4 py-3 bg-white border border-slate-200 rounded-2xl rounded-bl-sm shadow-sm flex items-center gap-1.5 object-contain">
                <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce"></div>
            </div>
            <span class="text-[10px] text-slate-400 mt-1 font-medium px-1">OSS Bot tape...</span>
        </div>
    </div>

    <!-- Input Area -->
    <div class="p-3 bg-white border-t border-slate-100 shrink-0">
        <form (submit)="sendMessage()" class="flex gap-2">
            <input type="text" name="message" [(ngModel)]="inputText" [placeholder]="translate.t.chatPlaceholder"
                class="flex-1 bg-slate-50 border border-slate-200 text-sm rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all text-slate-700"
                autocomplete="off" [disabled]="isWaiting">
            <button type="submit" [disabled]="!inputText.trim() || isWaiting"
                class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <span class="material-symbols-outlined text-lg">send</span>
            </button>
        </form>
        <div class="text-[10px] text-center text-slate-400 mt-2 font-medium">L'IA peut générer des informations
            imprécises.</div>
    </div>
</div>
