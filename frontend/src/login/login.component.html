<div class="login-layout">

  <!-- Left image panel — Savanna -->
  <div class="panel-image">
    <img src="assets/africa_left.png" alt="Savane africaine" />
    <span class="panel-label">🌍 Savane Africaine</span>
  </div>

  <!-- Center login form -->
  <div class="panel-login">

    <!-- Logo -->
    <div class="logo-badge">
      <img alt="OSS Logo" style="height:50px;width:auto;border-radius:12px;" src="assets/oss-logo.jpg"
        onerror="this.style.display='none';document.getElementById('logo-fb').style.display='flex';" />
      <div id="logo-fb"
        style="display:none;width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,#0067B1,#0052a3);align-items:center;justify-content:center;">
        <span style="color:#fff;font-weight:900;font-size:17px;letter-spacing:-1px;">OSS</span>
      </div>
    </div>

    <!-- Stripe badge -->
    <div class="oss-stripe">
      <span class="dot"></span>
      Observatoire du Sahara et du Sahel
    </div>

    <!-- Title -->
    <h1 class="login-title">{{ t.welcome }}</h1>
    <p class="login-subtitle">{{ t.signInDesc }}</p>

    <!-- Error -->
    <div *ngIf="errorMessage" class="error-box">
      <span class="material-symbols-outlined" style="font-size:18px;flex-shrink:0;">error</span>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Form -->
    <form style="width:100%;" (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="field-group">
        <label for="username">{{ t.usernameLabel }}</label>
        <div class="field-inner">
          <span class="icon-left material-symbols-outlined">person</span>
          <input id="username" name="username" type="email" autocomplete="email" autocorrect="off" autocapitalize="none"
            spellcheck="false" [placeholder]="t.usernamePlaceholder" [(ngModel)]="username" required />
        </div>
      </div>

      <!-- Password -->
      <div class="field-group">
        <label for="password">{{ t.passwordLabel }}</label>
        <div class="field-inner">
          <span class="icon-left material-symbols-outlined">lock</span>
          <input id="password" name="password" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••"
            [(ngModel)]="password" required style="padding-right:42px;" />
          <span class="icon-right material-symbols-outlined" (click)="togglePasswordVisibility()">
            {{ showPassword ? 'visibility' : 'visibility_off' }}
          </span>
        </div>
      </div>

      <!-- Submit -->
      <button class="btn-submit" type="submit">
        {{ t.signInBtn }}
      </button>

    </form>

    <!-- Footer -->
    <p class="login-footer">© 2025 OSS · Portail Sécurisé</p>

  </div>

  <!-- Right image panel — Forest -->
  <div class="panel-image right">
    <img src="assets/africa_right.png" alt="Forêt tropicale africaine" />
    <span class="panel-label">🌿 Forêt Tropicale</span>
  </div>

</div>
